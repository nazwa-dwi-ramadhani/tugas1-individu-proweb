    <style>
        body {
            font-family: Nunito;
        }

        h1 {
            font-family: Google Sans;
        }

        a {
            text-decoration: none;
            color: #000;
        }

        .cadetblue-bg {
            background-color: cadetblue;
            opacity: 90%;
        }

        .cadetblue-color {
            color: cadetblue;
        }

        .aliceblue {
            color: aliceblue;
        }
    </style>
</head>

<body>

    <div class="d-flex flex-column container justify-content-center align-items-center min-vh-100">
        <form class="card p-3 border" name="forminput">
            <div class="p-3 text-center">
                <h1 class="mb-4 cadetblue-color">Kalkulator Minie</h1>

                <div class="form-floating mb-3">
                    <input type="number" class="form-control rounded-4" name="bilangan1" id="bil1" placeholder="1"/>
                    <label for="bil1">Bilangan pertama</label>
                </div>

                <div class="mb-3 form-floating">
                    <input type="number" class="form-control rounded-4" name="bilangan2" id="bil2" placeholder="1"/>
                    <label for="bil2">Bilangan kedua</label>
                </div>

                <div class="d-flex gap-2 justify-content-center mb-3">
                    <button type="button" onclick="tambah()" class="btn cadetblue-bg aliceblue px-3 rounded-4">+</button>
                    <button type="button" onclick="kurang()" class="btn cadetblue-bg aliceblue px-3 rounded-4">-</button>
                    <button type="button" onclick="kali()" class="btn cadetblue-bg aliceblue px-3 rounded-4">x</button>
                    <button type="button" onclick="bagi()" class="btn cadetblue-bg aliceblue px-3 rounded-4">/</button>
                    <button type="reset" class="btn cadetblue-bg aliceblue px-3 rounded-4">Reset</button>
                </div>
                
                <div class="form-floating mb-3">
                    <input class="form-control rounded-4" type="number" id="hasil" placeholder="1" readonly />
                    <label>Hasil</label>
                </div>
            </div>
        </form>
    <div class="mt-3">
        <button type="button" class="btn cadetblue-bg px-3 rounded-4"><a href="index.html">Kembali</a></button>
    </div>
    </div>

    <script>
        function tambah() {
            let bilangan1 = document.forminput.bilangan1.valueAsNumber;
            let bilangan2 = document.forminput.bilangan2.valueAsNumber;
            document.getElementById("hasil").value = bilangan1 + bilangan2;
        }

        function kurang() {
            let bilangan1 = document.forminput.bilangan1.valueAsNumber;
            let bilangan2 = document.forminput.bilangan2.valueAsNumber;
            document.getElementById("hasil").value = bilangan1 - bilangan2;
        }

        function kali() {
            let bilangan1 = document.forminput.bilangan1.valueAsNumber;
            let bilangan2 = document.forminput.bilangan2.valueAsNumber;
            document.getElementById("hasil").value = bilangan1 * bilangan2;
        }

        function bagi() {
            let bilangan1 = document.forminput.bilangan1.valueAsNumber;
            let bilangan2 = document.forminput.bilangan2.valueAsNumber;
            document.getElementById("hasil").value = bilangan1 / bilangan2;
        }

        // function hitung(tambah) {

        //     document.getElementById("hasil").value = bilangan1 + bilangan2;
        // }

    </script>
